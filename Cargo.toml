[package]
name = "dreams"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
# Dialog is git-only and breaks often: one pinned tag for every crate.
# tests/dialog_smoke.rs pins the behaviours dreams relies on; run it first after an upgrade.
dialog-artifacts = { git = "https://github.com/dialog-db/dialog-db", tag = "v0.4.0-rc.2" }
dialog-capability = { git = "https://github.com/dialog-db/dialog-db", tag = "v0.4.0-rc.2" }
dialog-credentials = { git = "https://github.com/dialog-db/dialog-db", tag = "v0.4.0-rc.2" }
dialog-effects = { git = "https://github.com/dialog-db/dialog-db", tag = "v0.4.0-rc.2" }
dialog-peer = { git = "https://github.com/dialog-db/dialog-db", tag = "v0.4.0-rc.2" }
dialog-query = { git = "https://github.com/dialog-db/dialog-db", tag = "v0.4.0-rc.2" }
dialog-repository = { git = "https://github.com/dialog-db/dialog-db", tag = "v0.4.0-rc.2" }
dialog-storage = { git = "https://github.com/dialog-db/dialog-db", tag = "v0.4.0-rc.2" }
dialog-varsig = { git = "https://github.com/dialog-db/dialog-db", tag = "v0.4.0-rc.2" }
anyhow = "1"
diffy = "0.5"
feed-rs = "2.4"
html2text = "0.17"
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3"
rmcp = { version = "3.4", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
slug = "0.1"
tantivy = "0.27"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-std", "io-util", "process", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3.4"
uuid = { version = "1", features = ["v7"] }
